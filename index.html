    function escapeHtml(value) {
      const characters = {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      };

      return String(value).replace(
        /[&<>"']/g,
        character => characters[character]
      );
    }

    function svgImage(title, subtitle, background = "#edf2f3") {
      const svg = `
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="600"
          height="600"
          viewBox="0 0 600 600"
        >
          <rect width="600" height="600" fill="${background}" />
          <path
            d="M440 0H600V600H280Z"
            fill="#ffffff"
            opacity="0.5"
          />
          <text
            x="45"
            y="80"
            font-family="sans-serif"
            font-size="17"
            letter-spacing="3"
            fill="#67777b"
          >WORK &amp; ME</text>
          <text
            x="45"
            y="290"
            font-family="sans-serif"
            font-size="41"
            font-weight="700"
            fill="#242b30"
          >${escapeHtml(title)}</text>
          <text
            x="45"
            y="340"
            font-family="sans-serif"
            font-size="15"
            letter-spacing="2"
            fill="#67777b"
          >${escapeHtml(subtitle)}</text>
          <path d="M45 450H195M175 435L195 450L175 465"
            fill="none"
            stroke="#087d90"
            stroke-width="3"
          />
          <text
            x="45"
            y="520"
            font-family="sans-serif"
            font-size="15"
            fill="#67777b"
          >SAMPLE VISUAL</text>
        </svg>
      `;

      return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
    }

    function imageMarkup(source, className, eager = false) {
      return `
        <img
          class="${className}"
          src="${escapeHtml(source)}"
          alt=""
          loading="${eager ? "eager" : "lazy"}"
          decoding="async"
          data-fallback
        >
      `;
    }

    function installImageFallbacks() {
      main.querySelectorAll("[data-fallback]").forEach(image => {
        const replace = () => {
          image.onerror = null;
          image.src = svgImage("WORK & ME", "STORIES & LIFESTYLE");
        };

        image.onerror = replace;

        if (image.complete && image.naturalWidth === 0) {
          replace();
        }
      });
    }

    function updateListing(category, query) {
      const keyword = query.trim().normalize("NFKC").toLowerCase();
      let results;

      if (category === "companies") {
        results = COMPANIES.filter(company => {
          const text = [
            company.name,
            company.title,
            company.description,
            company.industry
          ].join(" ").normalize("NFKC").toLowerCase();

          return text.includes(keyword);
        });

        document.getElementById("result-grid").innerHTML =
          results.map(companyCard).join("");
      } else {
        results = STORIES.filter(story => {
          const text = [
            story.title,
            story.description,
            story.source,
            ...story.tags
          ].join(" ").normalize("NFKC").toLowerCase();

          return story.category === category && text.includes(keyword);
        });

        document.getElementById("result-grid").innerHTML =
          results.map(storyCard).join("");
      }

      document.getElementById("search-result").textContent =
        results.length
          ? `${results.length}件見つかりました。`
          : "該当する情報がありません。別のキーワードでお試しください。";

      installImageFallbacks();
    }

          ? url.href
          : "";
      } catch {
        return "";
      }
    }

            <h2>情報の訂正・掲載に関するご相談</h2>
            <p>
              本番公開時に専用窓口を設けます。
              誤情報、写真・発言の利用、記事の更新について対応します。
            </p>

            <a class="arrow-link" href="#/contact">お問い合わせについて</a>
          `
        },

        contact: {
          title: "掲載・広告のお問い合わせ",
          english: "PARTNERSHIP",
          description: "企業の想いと、働く人の声を届けるお手伝い。",
          body: `
            <h2>掲載メニュー</h2>
            <ul>
              <li>女性社員インタビュー・社員対談</li>
              <li>企業紹介・採用広報ページ</li>
              <li>美容・ファッションのタイアップ記事</li>
              <li>正方形画像広告</li>
            </ul>

            <h2>画像広告の仕様</h2>
            <dl class="info">
              <div>
                <dt>推奨サイズ</dt>
                <dd>600 × 600ピクセル</dd>
              </div>
              <div>
                <dt>画像形式</dt>
                <dd>WebP、JPEG、PNG</dd>
              </div>
              <div>
                <dt>表示位置</dt>
                <dd>パソコン：右側 / スマートフォン：本文下</dd>
              </div>
              <div>
                <dt>切り替え</dt>
                <dd>6秒ごと。停止・再開と手動切り替えが可能。</dd>
              </div>
            </dl>

            <p class="notice">
              問い合わせ送信機能は未実装です。
              本番では送信処理、迷惑投稿対策、
              個人情報の取り扱いへの同意を実装してください。
            </p>
          `
        },

        privacy: {
          title: "プライバシーについて",
          english: "PRIVACY",
          description: "公開前の確認事項。",
          body: `
            <p class="notice">
              正式なプライバシーポリシーではありません。
              実際の運用に合わせた規定へ差し替えてください。
            </p>

            <h2>このデモの情報取得</h2>
            <p>
              検索語はブラウザ内で処理します。
              問い合わせ送信、会員登録、
              アクセス解析、広告クリックの記録は実装していません。
            </p>

            <h2>外部画像の読み込み</h2>
            <p>
              サンプル写真を外部サービスから読み込むため、
              画像取得時にIPアドレスなどの通信情報が外部へ送信されます。
              本番では許諾済み画像を自社管理の配信先に置く方法も検討してください。

            <h2>本番で定める事項</h2>
            <ul>
              <li>運営者と問い合わせ先</li>

              <li>委託先・第三者提供の有無</li>

      return pages[page];
    }

    function notFound() {
      return `
        <div class="intro">
          <p class="eyebrow">NOT FOUND</p>
          <h1>ページが見つかりません</h1>
          <p>リンク先が変更された可能性があります。</p>
        </div>
        <a class="button" href="#/">トップへ戻る</a>
      `;
    }

    let initialized = false;

    function closeMenu() {
      navigation.classList.remove("is-open");
      menuToggle.setAttribute("aria-expanded", "false");
      menuToggle.textContent = "メニュー";
    }

    function renderRoute() {
      const routeText = location.hash.startsWith("#/")
        ? location.hash.slice(1)
        : "/";

      const separator = routeText.indexOf("?");
      const path = separator === -1
        ? routeText
        : routeText.slice(0, separator);
      const query = separator === -1
        ? ""
        : routeText.slice(separator + 1);

      const parameters = new URLSearchParams(query);
      const segments = path.split("/").filter(Boolean);
      const route = segments[0] || "home";

      let title = "働く私に、次のきっかけを。";
      let activeCategory = route;

      if (route === "home") {
        main.innerHTML = renderHome();
      } else if (CATEGORIES[route]) {
        const keyword = parameters.get("q") || "";
        title = CATEGORIES[route].name;
        main.innerHTML = renderListing(route, keyword);
        updateListing(route, keyword);

        document.getElementById("search-input")
          .addEventListener("input", event => {
            updateListing(route, event.target.value);
          });
      } else if (route === "article") {
        const story = STORIES.find(item => item.id === segments[1]);

        title = story ? story.title : "ページが見つかりません";
        activeCategory = story ? story.category : "";
        main.innerHTML = story ? renderStory(story) : notFound();
      } else if (route === "company") {
        const company = COMPANIES.find(item => item.id === segments[1]);

        title = company ? company.name : "ページが見つかりません";
        activeCategory = "companies";
        main.innerHTML = company ? renderCompany(company) : notFound();
      } else {
        const page = renderStatic(route);

        if (page) {
          title = page.title;
          main.innerHTML = `
            <article>
              <div class="intro">
                <p class="eyebrow">${page.english}</p>
                <h1>${page.title}</h1>
                <p>${page.description}</p>
              </div>
              <div class="article-body">${page.body}</div>
            </article>
          `;
        } else {
          title = "ページが見つかりません";
          main.innerHTML = notFound();
        }
      }

      document.title = `${title}｜WORK & ME`;

      navigation.querySelectorAll("a").forEach(link => {
        if (link.getAttribute("href") === `#/${activeCategory}`) {
          link.setAttribute("aria-current", "page");
        } else {
          link.removeAttribute("aria-current");
        }
      });

      closeMenu();
      installImageFallbacks();

      if (initialized) {
        main.focus({ preventScroll: true });
        window.scrollTo({ top: 0, behavior: "instant" });
      }

      initialized = true;
    }

    menuToggle.addEventListener("click", () => {
      const open = navigation.classList.toggle("is-open");

      menuToggle.setAttribute("aria-expanded", String(open));
      menuToggle.textContent = open ? "閉じる" : "メニュー";
    });

    document.addEventListener("keydown", event => {
      if (
        event.key === "Escape" &&
        navigation.classList.contains("is-open")
      ) {
        closeMenu();
        menuToggle.focus();
      }
    });

    /*
     * 画像広告:
     * ADS の image と href を差し替えて設定します。
     * 画像ファイルがない場合はサンプル画像を自動生成します。
     * リンク先にはサイト内ページまたは http / https を指定できます。
     */

    const adRail = document.querySelector(".rail");
    const adLink = document.getElementById("ad-link");
    const adImage = document.getElementById("ad-image");
    const adCaption = document.getElementById("ad-caption");
    const adCount = document.getElementById("ad-count");
    const adToggle = document.getElementById("ad-toggle");
    const adNext = document.getElementById("ad-next");
    const motionPreference = window.matchMedia(
      "(prefers-reduced-motion: reduce)"
    );

    let adIndex = 0;
    let adTimer = null;
    let adPaused = motionPreference.matches;
    let pointerInside = false;

    function advertisementHref(value) {
      return value.startsWith("#/") ? value : safeLink(value);
    }

    function showAd() {
      const ad = ADS[adIndex];
      const href = advertisementHref(ad.href);

      if (href) {
        adLink.href = href;
      } else {
        adLink.removeAttribute("href");
      }

      adImage.alt = ad.alt;
      adImage.onerror = () => {
        adImage.onerror = null;
        adImage.src = svgImage(
          ad.title,
          ad.subtitle,
          ad.background
        );
      };

      adImage.src = ad.image || svgImage(
        ad.title,
        ad.subtitle,
        ad.background
      );

      adCaption.textContent = ad.caption;
      adCount.textContent = `${adIndex + 1} / ${ADS.length}`;
    }

    function nextAd() {
      adIndex = (adIndex + 1) % ADS.length;
      showAd();
    }

    function synchronizeAdTimer() {
      window.clearInterval(adTimer);
      adTimer = null;

      adToggle.textContent = adPaused ? "再開" : "停止";
      adToggle.setAttribute(
        "aria-label",
        adPaused
          ? "広告の自動切り替えを再開"
          : "広告の自動切り替えを停止"
      );

      const focused = adRail.contains(document.activeElement);

      if (
        adPaused ||
        pointerInside ||
        focused ||
        document.hidden ||
        ADS.length < 2
      ) {
        return;
      }

      adTimer = window.setInterval(nextAd, 6000);
    }

    adToggle.addEventListener("click", () => {
      adPaused = !adPaused;
      synchronizeAdTimer();
    });

    adNext.addEventListener("click", () => {
      nextAd();
      synchronizeAdTimer();
    });

    adRail.addEventListener("mouseenter", () => {
      pointerInside = true;
      synchronizeAdTimer();
    });

    adRail.addEventListener("mouseleave", () => {
      pointerInside = false;
      synchronizeAdTimer();
    });

    adRail.addEventListener("focusin", synchronizeAdTimer);

    adRail.addEventListener("focusout", () => {
      window.setTimeout(synchronizeAdTimer, 0);
    });

    document.addEventListener(
      "visibilitychange",
      synchronizeAdTimer
    );

    motionPreference.addEventListener("change", event => {
      if (event.matches) {
        adPaused = true;
      }

      synchronizeAdTimer();
    });

    window.addEventListener("hashchange", renderRoute);

    renderRoute();

    if (ADS.length > 0) {
      showAd();
      synchronizeAdTimer();
    } else {
      adRail.hidden = true;
    }
  </script>
</body>
</html>
